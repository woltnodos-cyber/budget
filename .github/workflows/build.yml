name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile --add-data "budget_tracker/categories.csv;." budget_tracker/pusk.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pusk-exe
          path: dist/pusk.exe
