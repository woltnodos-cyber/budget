name: Build Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib pyinstaller

    - name: Find and Build with PyInstaller
      run: |
        # Автоматически ищем файл pusk.py в репозитории и собираем его
        $script = Get-ChildItem -Recurse -Filter "pusk.py" | Select-Object -First 1
        if ($script) {
            Write-Host "Found script at: $($script.FullName)"
            pyinstaller --noconsole --onefile $($script.FullName)
        } else {
            Write-Error "File pusk.py not found!"
            exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pusk-exe
        path: dist/pusk.exe
